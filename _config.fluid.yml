# Fluid 个性化配置（未列出的选项继承 themes/fluid/_config.yml）
favicon: /img/favicon.svg
apple_touch_icon: /img/favicon.svg
force_https: true

navbar:
  blog_title: "拾光笔记"
  ground_glass:
    enable: true
    px: 3
    alpha: 0.72
  menu:
    - { key: "home", link: "/", icon: "iconfont icon-home-fill" }
    - { key: "archive", link: "/archives/", icon: "iconfont icon-archive-fill" }
    - { key: "category", link: "/categories/", icon: "iconfont icon-category-fill" }
    - { key: "tag", link: "/tags/", icon: "iconfont icon-tags-fill" }
    - { key: "about", link: "/about/", icon: "iconfont icon-user-fill" }

search:
  enable: true
  path: /local-search.xml
  generate_path: local-search.xml
  field: post
  content: true

banner:
  random_img: false
  parallax: true

index:
  banner_img: /img/banner.svg
  banner_img_height: 100
  banner_mask_alpha: 0.28
  slogan:
    enable: true
    text:
      - "认真记录，每一次发现"
      - "保持好奇，持续创造"
      - "把复杂的世界，写成清楚的文字"
  auto_excerpt:
    enable: true
  post_url_target: _self
  post_meta:
    date: true
    category: true
    tag: true

post:
  banner_img: /img/banner.svg
  banner_img_height: 70
  banner_mask_alpha: 0.32
  meta:
    author:
      enable: true
    date:
      enable: true
    wordcount:
      enable: true
    min2read:
      enable: true
  toc:
    enable: true
    headingSelector: "h1,h2,h3,h4"
  copyright:
    enable: true
    license: "BY-NC-SA"
    author:
      enable: true

archive:
  banner_img: /img/banner.svg
  banner_img_height: 60
  banner_mask_alpha: 0.3

category:
  enable: true
  banner_img: /img/banner.svg
  banner_img_height: 60
  banner_mask_alpha: 0.3

tag:
  enable: true
  banner_img: /img/banner.svg
  banner_img_height: 60
  banner_mask_alpha: 0.3

about:
  enable: true
  banner_img: /img/banner.svg
  banner_img_height: 60
  banner_mask_alpha: 0.3
  avatar: /img/avatar.gif
  name: "xwh"
  intro: "技术、设计与生活的长期记录者"
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/xwh1103", tip: "GitHub" }
    - { class: "iconfont icon-mail", link: "1814563903@qq.com", tip: "Email" }

footer:
  content: '愿每一次记录，都成为时间里的微光。'
  statistics:
    enable: false

lazyload:
  enable: true
  onlypost: false


